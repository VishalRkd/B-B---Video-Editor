[versions]
# --- Android Gradle Plugin ---
agp = "9.1.1"

# --- Kotlin Symbol Processing ---
# Kotlin 2.2.21 is bundled with Gradle 9.3.1 — no separate kotlin plugin needed.
# KSP version must match the bundled Kotlin version exactly.
ksp = "2.2.21-2.0.5"
kotlin = "2.2.21"

# --- Core AndroidX ---
coreKtx = "1.19.0"
appcompat = "1.7.1"
activity = "1.13.0"
fragment = "1.8.6"
constraintlayout = "2.2.1"
material = "1.14.0"

# --- Lifecycle & ViewModel ---
lifecycle = "2.8.7"

# --- Navigation Component ---
navigation = "2.8.5"

# --- Dependency Injection (Hilt) ---
# Hilt 2.56+ is required for AGP 9.x (uses AndroidComponentsExtension, not deprecated BaseExtension)
hilt = "2.60.1"
hiltNavigationFragment = "1.2.0"

# --- Room Database ---
room = "2.7.1"

# --- Coroutines ---
coroutines = "1.9.0"

# --- Image Loading (Coil) ---
coil = "2.7.0"

# --- JSON Serialization ---
gson = "2.11.0"

# --- Testing ---
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# =============================================================================
[libraries]
# --- Core AndroidX ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# --- Lifecycle & ViewModel ---
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }

# --- Navigation Component ---
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# --- Dependency Injection (Hilt) ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-fragment = { group = "androidx.hilt", name = "hilt-navigation-fragment", version.ref = "hiltNavigationFragment" }

# --- Room Database ---
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# --- Coroutines ---
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Image Loading ---
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }

# --- JSON Serialization ---
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# --- Testing ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# =============================================================================
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

